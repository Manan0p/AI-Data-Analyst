<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="55" y="48" font-family="Arial" font-size="27" font-weight="700" fill="#17324d">Background-job state transitions</text>
<text x="55" y="76" font-family="Arial" font-size="16" fill="#475569">JobManager uses a four-worker in-process ThreadPoolExecutor and exposes status through GET /api/jobs/{id}.</text>
<rect x="100" y="350" width="230" height="145" rx="14" fill="#e8f1f8" stroke="#17324d" stroke-width="3"/>
<text x="118" y="384" font-family="Arial" font-size="21" font-weight="700" fill="#17324d">submit_job</text>
<text x="118" y="418" font-family="Arial" font-size="17" fill="#1e293b">create job_id</text>
<text x="118" y="443" font-family="Arial" font-size="17" fill="#1e293b">status = processing</text>
<rect x="500" y="350" width="250" height="145" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="3"/>
<text x="518" y="384" font-family="Arial" font-size="21" font-weight="700" fill="#17324d">PROCESSING</text>
<text x="518" y="418" font-family="Arial" font-size="17" fill="#1e293b">worker executes fn</text>
<text x="518" y="443" font-family="Arial" font-size="17" fill="#1e293b">record under lock</text>
<rect x="950" y="190" width="250" height="145" rx="14" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
<text x="968" y="224" font-family="Arial" font-size="21" font-weight="700" fill="#17324d">COMPLETED</text>
<text x="968" y="258" font-family="Arial" font-size="17" fill="#1e293b">result stored</text>
<text x="968" y="283" font-family="Arial" font-size="17" fill="#1e293b">status returned</text>
<rect x="950" y="510" width="250" height="145" rx="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="3"/>
<text x="968" y="544" font-family="Arial" font-size="21" font-weight="700" fill="#17324d">FAILED</text>
<text x="968" y="578" font-family="Arial" font-size="17" fill="#1e293b">error stored</text>
<text x="968" y="603" font-family="Arial" font-size="17" fill="#1e293b">status returned</text>
<line x1="330" y1="422" x2="500" y2="422" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="750" y1="390" x2="950" y2="260" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="850" y="317" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">fn succeeds</text>
<line x1="750" y1="455" x2="950" y2="580" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="850" y="509" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">exception</text>
<text x="1260" y="400" font-family="Arial" font-size="17" fill="#475569">Owner ID is checked when a job is polled.</text>
</svg>